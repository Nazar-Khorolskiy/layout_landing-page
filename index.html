    <title>Nothing</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"

    <link

      rel="stylesheet"

        <a href="#" class="top-bar__logo">

        <a href="#" class="top-bar__logo">
          <img

        <nav class="nav menu__nav">
          <ul class="nav__list">
            <li class="nav__item">

              </a>

            <li class="nav__item">
              <a
                class="nav__link"

            </li>
            <li class="nav__item">

                class="nav__link"

              </a>

            <li class="nav__item">

                class="nav__link"

              >
                Cart(0)
              </a>
            </li>
          </ul>
        </nav>

        <a
          href="tel:+1 234 5555-55-55"
          class="menu__phone-number"
        >
          +1 234 5555-55-55
        </a>
        <a
          href="tel:+1 234 5555-55-55"
          class="menu__call-to-order"
        >
          call to order
        </a>

    <main class="main">
      <section class="recommended">
        <h2>Recommended</h2>
      </section>

      <section
        class="products"
        id="products"
      >
        <h2>Browse Nothing products by category</h2>
      </section>

      <section class="about-us">
        <h2>About us</h2>
      </section>

    <footer class="footer">
      <h2>Contact us</h2>
    </footer>
